<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soni Bangles — Billing</title>
<style>
:root{
  --bg:#dbeafe; --card:#ffffff; --ink:#2a1e1a; --sub:#7a6a5f;
  --accent:#facc15; --accent2:#8b3a3a; --border:#e8ddd0; --danger:#b23b3b;
  --shadow:0 2px 10px rgba(60,40,20,0.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d4ed8; --card:#251f1b; --ink:#f0e6da; --sub:#b3a294;
    --accent:#facc15; --accent2:#d97a7a; --border:#3a322b;
  }
}
:root[data-theme="dark"]{
  --bg:#1d4ed8; --card:#251f1b; --ink:#f0e6da; --sub:#b3a294;
  --accent:#facc15; --accent2:#d97a7a; --border:#3a322b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Tahoma,Georgia,serif;min-height:100%;}
header{padding:18px 16px 10px;text-align:center;}
header h1{margin:0;font-size:1.5rem;letter-spacing:.5px;}
header p{margin:4px 0 0;color:var(--sub);font-size:.85rem;}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--border);}
nav button{flex:0 0 auto;background:none;border:none;padding:8px 14px;border-radius:20px;color:var(--sub);font-size:.9rem;cursor:pointer;}
nav button.active{background:var(--accent);color:#1b1613;font-weight:600;}
main{max-width:640px;margin:0 auto;padding:14px 12px 60px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
.card h2{margin:0 0 10px;font-size:1.05rem;}
label{display:block;font-size:.78rem;color:var(--sub);margin:8px 0 3px;}
input,select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.92rem;}
.row2{display:flex;gap:8px;}
.row2>div{flex:1;}
button.btn{margin-top:12px;background:var(--accent);color:#1b1613;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem;}
button.btn.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent);}
button.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:6px 10px;font-size:.8rem;margin-top:0;}
.plist{list-style:none;padding:0;margin:0;}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:8px;}
.plist li:last-child{border-bottom:none;}
.pname{font-weight:600;font-size:.92rem;}
.pprice{color:var(--sub);font-size:.78rem;}
.cartline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:.88rem;}
.cartline:last-child{border-bottom:none;}
.total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:700;margin-top:10px;padding-top:10px;border-top:2px solid var(--accent);}
.hidden{display:none !important;}
.designs{display:flex;gap:8px;overflow-x:auto;padding:4px 0;}
.designs label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--sub);cursor:pointer;flex:0 0 auto;margin:0;}
.designs input{width:auto;}
.swatch{width:52px;height:36px;border-radius:6px;border:2px solid var(--border);}
.sw-classic{background:linear-gradient(135deg,#fff,#f3e6c8);}
.sw-modern{background:linear-gradient(135deg,#1b1613,#3a322b);}
.sw-elegant{background:linear-gradient(135deg,#fff0f0,#f8d9b0);}
#billPreview{background:#fff;color:#2a1e1a;border-radius:10px;padding:22px;margin-top:14px;}
#billPreview.modern{background:#1b1613;color:#f0e6da;}
#billPreview.elegant{background:#fffaf3;color:#2a1e1a;border:1px solid #d8b98a;}
.bhead{text-align:center;margin-bottom:12px;}
.bhead .bname{font-size:1.3rem;font-weight:700;letter-spacing:.5px;}
#billPreview.modern .bname{color:#e0ac2e;}
#billPreview.elegant .bname{font-family:Georgia,serif;color:#8b3a3a;}
.baddr{font-size:.78rem;color:#7a6a5f;}
#billPreview.modern .baddr{color:#b3a294;}
.bmeta{display:flex;justify-content:space-between;font-size:.8rem;margin:10px 0;flex-wrap:wrap;gap:4px;}
table.btab{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:6px;}
table.btab th,table.btab td{padding:6px 4px;text-align:left;border-bottom:1px solid #ddd;}
#billPreview.modern table.btab th,#billPreview.modern table.btab td{border-bottom:1px solid #3a322b;}
table.btab th{color:var(--accent2);font-size:.72rem;text-transform:uppercase;}
.bgrand{text-align:right;font-size:1.15rem;font-weight:700;margin-top:10px;}
.bfoot{text-align:center;font-size:.72rem;color:#a99;margin-top:16px;}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.empty{color:var(--sub);font-size:.85rem;text-align:center;padding:12px 0;}
@media print{
  body *{visibility:hidden;}
  #billPreview,#billPreview *{visibility:visible;}
  #billPreview{position:absolute;top:0;left:0;width:100%;margin:0;border-radius:0;}
}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<header>
  <h1 id="bizTitle">💍 Soni Bangles</h1>
  <p>Store &amp; Billing Manager</p>
</header>
<nav>
  <button class="tabbtn active" data-tab="products">Products</button>
  <button class="tabbtn" data-tab="billing">New Bill</button>
  <button class="tabbtn" data-tab="settings">Settings</button>
</nav>
<main>

  <section id="tab-products">
    <div class="card">
      <h2>Add Product</h2>
      <label>Product name</label>
      <input id="pName" placeholder="e.g. Gold Plated Bangle Set">
      <div class="row2">
        <div><label>Wholesale price (₹)</label><input id="pWholesale" type="number" min="0" step="0.01"></div>
        <div><label>Retail price (₹)</label><input id="pRetail" type="number" min="0" step="0.01"></div>
      </div>
      <button class="btn" id="addProductBtn">Add Product</button>
    </div>
    <div class="card">
      <h2>Your Products</h2>
      <input id="productSearch" placeholder="🔍 Search products…" style="margin-bottom:10px;">
      <ul class="plist" id="productList"><li class="empty">Loading…</li></ul>
    </div>
  </section>

  <section id="tab-billing" class="hidden">
    <div class="card">
      <h2>Customer Details</h2>
      <label>Customer name</label>
      <input id="custName" placeholder="Customer name">
      <label>Customer address</label>
      <input id="custAddr" placeholder="Customer address / phone">
    </div>
    <div class="card">
      <h2>Add Item to Bill</h2>
      <label>Product</label>
      <input id="cartProduct" list="cartProductOptions" placeholder="Type the first two letters of a product" autocomplete="off">
      <datalist id="cartProductOptions"></datalist>
      <div class="row2">
        <div><label>Price type</label>
          <select id="cartPriceType"><option value="retail">Retail</option><option value="wholesale">Wholesale</option></select>
        </div>
        <div><label>Quantity</label><input id="cartQty" type="number" min="1" value="1"></div>
      </div>
      <button class="btn secondary" id="addLineBtn">Add to Bill</button>
    </div>
    <div class="card">
      <h2>Bill Items</h2>
      <div id="cartLines"><p class="empty">No items added yet.</p></div>
      <div class="total"><span>Total</span><span id="grandTotal">₹0.00</span></div>
      <label style="margin-top:12px;">Bill design</label>
      <div class="designs">
        <label><input type="radio" name="design" value="classic" checked><span class="swatch sw-classic"></span>Classic</label>
        <label><input type="radio" name="design" value="modern"><span class="swatch sw-modern"></span>Modern</label>
        <label><input type="radio" name="design" value="elegant"><span class="swatch sw-elegant"></span>Elegant</label>
      </div>
      <div class="actions">
        <button class="btn" id="genBillBtn">Generate Bill</button>
        <button class="btn secondary" id="clearCartBtn">Clear Bill</button>
      </div>
    </div>
    <div id="billPreview" class="hidden classic"></div>
    <div class="actions" id="billActions" style="display:none;">
      <button class="btn secondary" id="printBillBtn">🖨️ Print</button>
      <button class="btn secondary" id="downloadPdfBtn">⬇️ Download PDF</button>
    </div>
  </section>

  <section id="tab-settings" class="hidden">
    <div class="card">
      <h2>Business Details</h2>
      <label>Business name</label>
      <input id="setName" placeholder="Soni Bangles">
      <label>Address</label>
      <input id="setAddr" placeholder="Shop address, city">
      <label>Phone</label>
      <input id="setPhone" placeholder="Phone number">
      <label>Tagline (optional)</label>
      <input id="setTagline" placeholder="e.g. Wholesale &amp; Retail Bangles">
      <button class="btn" id="saveSettingsBtn">Save Settings</button>
    </div>
  </section>

</main>

<script>
let db=null, dbReady=false;
let products=[]; // {id,name,wholesale,retail}
let settings={name:"Soni Bangles",address:"",phone:"",tagline:"Wholesale & Retail Bangles"};
let cart=[]; // {name,unit,qty,priceType}

const $=s=>document.querySelector(s);

// ---- Tabs ----
document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['products','billing','settings'].forEach(t=>$('#tab-'+t).classList.toggle('hidden', t!==b.dataset.tab));
}));

// ---- DB init ----
async function initDb(){
  try{
    db = await claude.use('db');
  }catch(e){ db=null; }
  if(!db){ // fallback: in-memory only for this session
    dbReady=false;
    renderProducts(); populateCartSelect();
    return;
  }
  dbReady=true;
  // settings
  try{
    const doc = await db.doc('settings/business').get();
    if(doc.exists){ settings = Object.assign(settings, doc.data()); applySettingsToUI(); }
  }catch(e){}
  db.doc('settings/business').onSnapshot(snap=>{
    if(snap.exists){ settings=Object.assign(settings,snap.data()); applySettingsToUI(); }
  }, ()=>{});
  // products
  db.collection('products').orderBy('createdAt','asc').onSnapshot(qs=>{
    products = qs.docs.map(d=>({id:d.id, ...d.data()}));
    renderProducts(); populateCartSelect();
  }, ()=>{ renderProducts(); populateCartSelect(); });
}

function applySettingsToUI(){
  $('#bizTitle').textContent = '💍 ' + (settings.name||'Soni Bangles');
  $('#setName').value=settings.name||''; $('#setAddr').value=settings.address||'';
  $('#setPhone').value=settings.phone||''; $('#setTagline').value=settings.tagline||'';
}
applySettingsToUI();

// ---- Products ----
function renderProducts(){
  const ul=$('#productList');
  const q=($('#productSearch')?.value||'').trim().toLowerCase();
  const list = q ? products.filter(p=>p.name.toLowerCase().includes(q)) : products;
  if(!products.length){ ul.innerHTML='<li class="empty">No products yet. Add your first bangle above.</li>'; return; }
  if(!list.length){ ul.innerHTML='<li class="empty">No products match your search.</li>'; return; }
  ul.innerHTML = list.map(p=>`
    <li>
      <div>
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pprice">Wholesale ₹${Number(p.wholesale).toFixed(2)} · Retail ₹${Number(p.retail).toFixed(2)}</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn secondary" style="padding:6px 10px;font-size:.8rem;margin-top:0;" data-edit="${p.id}">Edit</button>
        <button class="btn danger" data-id="${p.id}">Remove</button>
      </div>
    </li>`).join('');
  ul.querySelectorAll('button[data-id]').forEach(btn=>btn.addEventListener('click', ()=>removeProduct(btn.dataset.id)));
  ul.querySelectorAll('button[data-edit]').forEach(btn=>btn.addEventListener('click', ()=>startEditProduct(btn.dataset.edit)));
}

let editingId=null;
async function addProduct(){
  const name=$('#pName').value.trim();
  const wholesale=parseFloat($('#pWholesale').value);
  const retail=parseFloat($('#pRetail').value);
  if(!name || isNaN(wholesale) || isNaN(retail)){ alert('Please fill product name, wholesale and retail price.'); return; }
  if(editingId){
    const data={name, wholesale, retail};
    if(dbReady){ try{ await db.doc('products/'+editingId).update(data); }catch(e){ alert('Could not update product.'); } }
    else{ const p=products.find(x=>x.id===editingId); if(p) Object.assign(p,data); renderProducts(); populateCartSelect(); }
    cancelEdit();
    return;
  }
  const data={name, wholesale, retail, createdAt:Date.now()};
  if(dbReady){
    await db.collection('products').add(data);
  }else{
    products.push({id:'local_'+Date.now(), ...data}); renderProducts(); populateCartSelect();
  }
  $('#pName').value=''; $('#pWholesale').value=''; $('#pRetail').value='';
}
$('#addProductBtn').addEventListener('click', addProduct);
$('#productSearch').addEventListener('input', renderProducts);

function startEditProduct(id){
  const p=products.find(x=>x.id===id);
  if(!p) return;
  editingId=id;
  $('#pName').value=p.name; $('#pWholesale').value=p.wholesale; $('#pRetail').value=p.retail;
  $('#addProductBtn').textContent='Update Product';
  if(!document.getElementById('cancelEditBtn')){
    const cancel=document.createElement('button');
    cancel.id='cancelEditBtn'; cancel.className='btn secondary'; cancel.textContent='Cancel';
    cancel.style.marginLeft='8px';
    cancel.addEventListener('click', cancelEdit);
    $('#addProductBtn').insertAdjacentElement('afterend', cancel);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function cancelEdit(){
  editingId=null;
  $('#pName').value=''; $('#pWholesale').value=''; $('#pRetail').value='';
  $('#addProductBtn').textContent='Add Product';
  const c=document.getElementById('cancelEditBtn'); if(c) c.remove();
}

async function removeProduct(id){
  if(dbReady){ try{ await db.doc('products/'+id).delete(); }catch(e){} }
  else{ products=products.filter(p=>p.id!==id); renderProducts(); populateCartSelect(); }
}

// ---- Cart / Billing ----
function populateCartSelect(){
  updateCartProductOptions();
}

function updateCartProductOptions(){
  const input=$('#cartProduct');
  const list=$('#cartProductOptions');
  if(!input || !list) return;
  const query=input.value.trim().toLowerCase();
  const matches=query.length >= 1
    ? products.filter(p=>p.name.toLowerCase().startsWith(query))
    : products;
  list.innerHTML=matches.map(p=>`<option value="${escapeHtml(p.name)}"></option>`).join('');
}

$('#cartProduct').addEventListener('input', updateCartProductOptions);

$('#addLineBtn').addEventListener('click', ()=>{
  const productName=$('#cartProduct').value.trim().toLowerCase();
  const matches=products.filter(p=>p.name.toLowerCase().startsWith(productName));
  const p=products.find(x=>x.name.toLowerCase()===productName) || (matches.length===1 ? matches[0] : null);
  if(!p){ alert('Add a product first.'); return; }
  const qty=parseInt($('#cartQty').value)||1;
  const priceType=$('#cartPriceType').value;
  const unit = priceType==='wholesale' ? Number(p.wholesale) : Number(p.retail);
  cart.push({name:p.name, unit, qty, priceType});
  renderCart();
  $('#cartProduct').value='';
  updateCartProductOptions();
});

function renderCart(){
  const wrap=$('#cartLines');
  if(!cart.length){ wrap.innerHTML='<p class="empty">No items added yet.</p>'; $('#grandTotal').textContent='₹0.00'; return; }
  wrap.innerHTML = cart.map((c,i)=>`
    <div class="cartline">
      <span>${escapeHtml(c.name)} × ${c.qty} <span style="color:var(--sub);font-size:.75rem;">(${c.priceType})</span></span>
      <span>₹${(c.unit*c.qty).toFixed(2)} <a href="#" data-i="${i}" style="color:var(--danger);margin-left:8px;text-decoration:none;">✕</a></span>
    </div>`).join('');
  wrap.querySelectorAll('a[data-i]').forEach(a=>a.addEventListener('click', e=>{
    e.preventDefault(); cart.splice(parseInt(a.dataset.i),1); renderCart();
  }));
  const total=cart.reduce((s,c)=>s+c.unit*c.qty,0);
  $('#grandTotal').textContent='₹'+total.toFixed(2);
}
$('#clearCartBtn').addEventListener('click', ()=>{ cart=[]; renderCart(); $('#billPreview').classList.add('hidden'); $('#billActions').style.display='none'; });

function printBill(){
  if(!lastBill){ alert('Generate the bill first.'); return; }
  window.print();
}

$('#printBillBtn').addEventListener('click', printBill);

// ---- Bill generation ----
let lastBill=null;
$('#genBillBtn').addEventListener('click', ()=>{
  if(!cart.length){ alert('Add at least one item to the bill.'); return; }
  const design=document.querySelector('input[name="design"]:checked').value;
  const preview=$('#billPreview');
  preview.className=design;
  const total=cart.reduce((s,c)=>s+c.unit*c.qty,0);
  const date=new Date().toLocaleDateString();
  const custName=$('#custName').value.trim()||'Walk-in Customer';
  const custAddr=$('#custAddr').value.trim();
  lastBill={custName, custAddr, date, items:cart.map(c=>({...c})), total};
  preview.innerHTML=`
    <div class="bhead">
      <div class="bname">${escapeHtml(settings.name||'Soni Bangles')}</div>
      <div class="baddr">${escapeHtml(settings.address||'')}${settings.phone?' · '+escapeHtml(settings.phone):''}</div>
      <div class="baddr">${escapeHtml(settings.tagline||'')}</div>
    </div>
    <div class="bmeta">
      <div><strong>Bill To:</strong><br>${escapeHtml(custName)}${custAddr? '<br>'+escapeHtml(custAddr):''}</div>
      <div><strong>Date:</strong><br>${date}</div>
    </div>
    <table class="btab">
      <thead><tr><th>Item</th><th>Type</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
      <tbody>
        ${cart.map(c=>`<tr><td>${escapeHtml(c.name)}</td><td>${c.priceType}</td><td>${c.qty}</td><td>₹${c.unit.toFixed(2)}</td><td>₹${(c.unit*c.qty).toFixed(2)}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="bgrand">Grand Total: ₹${total.toFixed(2)}</div>
    <div class="bfoot">Thank you for shopping with ${escapeHtml(settings.name||'Soni Bangles')}!</div>
  `;
  preview.classList.remove('hidden');
  $('#billActions').style.display='flex';
  preview.scrollIntoView({behavior:'smooth'});
});

$('#downloadPdfBtn').addEventListener('click', async ()=>{
  if(!lastBill){ alert('Generate the bill first.'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    let y=50;
    doc.setFontSize(18); doc.text(settings.name||'Soni Bangles', 297, y, {align:'center'}); y+=20;
    doc.setFontSize(10);
    if(settings.address){ doc.text(settings.address, 297, y, {align:'center'}); y+=14; }
    if(settings.phone){ doc.text(settings.phone, 297, y, {align:'center'}); y+=14; }
    if(settings.tagline){ doc.text(settings.tagline, 297, y, {align:'center'}); y+=14; }
    y+=10;
    doc.setFontSize(11);
    doc.text('Bill To: '+lastBill.custName, 40, y); doc.text('Date: '+lastBill.date, 400, y); y+=16;
    if(lastBill.custAddr){ doc.text(lastBill.custAddr, 40, y); y+=16; }
    y+=10;
    doc.setFontSize(10);
    doc.text('Item', 40, y); doc.text('Type', 250, y); doc.text('Qty', 320, y); doc.text('Rate', 380, y); doc.text('Amount', 460, y);
    y+=6; doc.line(40,y,555,y); y+=14;
    lastBill.items.forEach(c=>{
      if(y>760){ doc.addPage(); y=50; }
      doc.text(String(c.name).slice(0,30), 40, y);
      doc.text(c.priceType, 250, y);
      doc.text(String(c.qty), 320, y);
      doc.text('Rs.'+c.unit.toFixed(2), 380, y);
      doc.text('Rs.'+(c.unit*c.qty).toFixed(2), 460, y);
      y+=16;
    });
    y+=6; doc.line(40,y,555,y); y+=20;
    doc.setFontSize(13);
    doc.text('Grand Total: Rs.'+lastBill.total.toFixed(2), 555, y, {align:'right'});
    y+=30;
    doc.setFontSize(9);
    doc.text('Thank you for shopping with '+(settings.name||'Soni Bangles')+'!', 297, y, {align:'center'});
    const blob = doc.output('blob');
    const fname=(settings.name||'Soni_Bangles').replace(/\s+/g,'_')+'_Bill_'+Date.now()+'.pdf';
    let downloads=null;
    if(typeof claude!=='undefined' && claude.use){
      try{ downloads = await claude.use('downloads'); }catch(e){}
    }
    if(downloads){
      await downloads.save({filename:fname, data:blob});
      return;
    }
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url; link.download=fname; link.style.display='none';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    console.error(e); alert('Could not generate PDF: '+(e.message||e));
  }
});

// ---- Settings ----
$('#saveSettingsBtn').addEventListener('click', async ()=>{
  const data={
    name:$('#setName').value.trim()||'Soni Bangles',
    address:$('#setAddr').value.trim(),
    phone:$('#setPhone').value.trim(),
    tagline:$('#setTagline').value.trim()
  };
  settings=Object.assign(settings,data);
  applySettingsToUI();
  if(dbReady){ try{ await db.doc('settings/business').set(data); }catch(e){} }
  alert('Settings saved.');
});

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

initDb();
</script>
</body>
</html>
